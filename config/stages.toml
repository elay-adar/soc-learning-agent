# Stage definitions (spec section 6.2). Change them here instead of editing code.
# Read with the stdlib "tomllib" -- no extra dependency (D-020).
#
# allowed_depths and allowed_diagrams are checked against the closed lists in src/schemas.py.
# The Planner picks from them; code rejects a plan that picks anything else.
# "content" is what the Lecturer is asked to cover; it is used in prompts, not enforced.

[[stage]]
number = 1
key = "overview"
subject = "Overview"
allowed_depths = ["overview"]
allowed_diagrams = ["story_flow"]
content = "A definition paragraph of 2 to 4 sentences (the technique or weakness category and MITRE tactic, what it targets, the core action in one clause); what assumption or trust is broken; the payload the attacker ends up holding, specific to this topic; the component or protocol involved and its normal function, the root cause and the preconditions, all conceptual; and the SOC angle on why it matters to an analyst. For a CVE with documented exploitation, also the incident story: who was affected, the damage and the rough timeline. No technical mechanism detail, and no CWE id, CVSS score or ATT&CK id in the prose."

[[stage]]
number = 2
key = "why_possible"
subject = "Why it is possible"
allowed_depths = ["conceptual", "technical"]
allowed_diagrams = ["architecture", "sequence"]
content = "The only in-depth technical explanation of the weakness. Anchor it in the CVE or CWE when there is one. When there is neither, say so explicitly (no CVE or CWE) and explain the protocol or design flaw itself. Cover the component and its normal function, the root cause (which security assumption broke), the failure mechanism step by step, the preconditions, and what a fix or hardening changes. Show the flawed architecture, but go no deeper than an analyst needs: no source code and no protocol-specification detail."

[[stage]]
number = 3
key = "attack_chain"
subject = "Execution flow"
allowed_depths = ["technical"]
allowed_diagrams = ["kill_chain_frames"]
content = "The internal execution steps of this one technique, in order (never a chain of several techniques). Each step says what the attacker does and refers back to stage 2 for the weakness it exploits, without re-explaining it. Includes the MITRE ATT&CK mapping."

[[stage]]
number = 4
key = "analyst_view"
subject = "What an analyst sees"
allowed_depths = ["operational"]
allowed_diagrams = ["detection_flow"]
content = "Telemetry per attack step, event IDs and key fields, detection logic, published IOCs with dates, false positives, and detection gaps."

[[stage]]
number = 5
key = "response_prevention"
subject = "Response and prevention"
allowed_depths = ["operational"]
allowed_diagrams = ["decision_tree"]
content = "Triage questions and outcomes, the Tier 1 boundary, containment options and side effects, eradication and recovery, hardening, and lessons."
